<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HFL – Official Membership Certificate</title>

<style>
:root { --gold: #d4af37; --neon: #0ff; --bg: #0a0a0c; }
body { margin:0; font-family:'Segoe UI', system-ui; background: var(--bg); color:#fff; overflow-x:hidden; }

.app-container { max-width:1000px; margin:40px auto; padding:30px; background: rgba(255,255,255,0.03); border-radius:20px; border:1px solid rgba(0,255,255,0.1); backdrop-filter:blur(10px); box-shadow:0 0 40px rgba(0,0,0,0.5);}
h1 { text-align:center; letter-spacing:5px; color: var(--neon); text-shadow:0 0 20px var(--neon); }

.grid { display:grid; grid-template-columns:1fr 1.5fr; gap:30px; }
.form-section { display:flex; flex-direction:column; gap:15px; }

input { background: rgba(0,0,0,0.4); border:1px solid #333; padding:15px; border-radius:8px; color:#fff; transition:0.3s;}
input:focus { border-color: var(--neon); outline:none; box-shadow:0 0 10px rgba(0,255,255,0.2);}

button { background: var(--neon); color:#000; padding:15px; border:none; border-radius:8px; font-weight:900; cursor:pointer; text-transform:uppercase; transition:0.3s;}
button:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 5px 15px var(--neon);}
button:disabled { opacity:0.5; cursor:not-allowed;}

#certCanvas { width:100%; border-radius:10px; border:2px solid var(--gold); background:#fff; box-shadow:0 20px 50px rgba(0,0,0,0.8);}
.hidden { display:none;}
</style>
</head>
<body>

<div class="app-container">
<h1>HFL OFFICIAL TERMINAL</h1>
<div class="grid">
    <!-- User Side -->
    <div class="form-section">
        <h3 style="color: var(--gold)">🏛️ Join the Organization</h3>
        <input type="text" id="name" placeholder="Full Name" required>
        <button id="masterBtn">Generate Certificate & Verify Identity</button>
        <button id="downloadBtn" class="hidden" style="background: var(--gold)">⬇️ Download PDF Certificate</button>
    </div>

    <!-- Certificate Preview -->
    <div class="preview-section">
        <canvas id="certCanvas" width="800" height="560"></canvas>
    </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
window.onload = () => {
    const canvas = document.getElementById('certCanvas');
    const ctx = canvas.getContext('2d');
    const masterBtn = document.getElementById('masterBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    const generateSerial = () => {
        const raw = `HFL-${Math.floor(1000 + Math.random()*9000)}-${Date.now().toString().slice(-4)}`;
        const check = raw.split('').reduce((acc,char)=>acc+char.charCodeAt(0),0)%10;
        return `${raw}-${check}`;
    };

    const renderCertificate = (name, serial) => {
        ctx.clearRect(0,0,canvas.width,canvas.height);

        // Background gradient
        const grad = ctx.createRadialGradient(400,280,50,400,280,500);
        grad.addColorStop(0,'#ffffff'); grad.addColorStop(1,'#f0f0f0');
        ctx.fillStyle = grad; ctx.fillRect(0,0,800,560);

        // Watermark
        ctx.save();
        ctx.translate(400,280);
        ctx.rotate(-Math.PI/4);
        ctx.font = "bold 80px Arial"; ctx.fillStyle = "rgba(0,0,0,0.03)";
        ctx.textAlign = "center";
        for(let i=-5;i<5;i++){ ctx.fillText("HFL OFFICIAL SYSTEM ".repeat(3),0,i*100); }
        ctx.restore();

        // Outer double gold frame
        ctx.strokeStyle="#d4af37"; ctx.lineWidth=15; ctx.strokeRect(20,20,760,520);
        ctx.lineWidth=2; ctx.strokeRect(35,35,730,490);

        // Organization name - big, official
        ctx.fillStyle="#1a1a1a"; ctx.textAlign="center";
        ctx.font="bold 50px 'Times New Roman'";
        ctx.fillText("HUMAN FREE LIGHT (HFL)",400,100);

        // Subtitle
        ctx.font="28px Arial"; ctx.fillText("Official Membership Certificate",400,150);

        // Verification text
        ctx.fillStyle="#333"; ctx.font="22px Arial"; ctx.fillText("This certifies that:",400,230);

        // User name
        ctx.fillStyle="#000"; ctx.font="bold 45px Arial"; ctx.fillText(name,400,290);

        // Serial number
        ctx.font="18px monospace"; ctx.fillStyle="#666"; ctx.fillText(`SERIAL: ${serial}`,400,480);

        // Red approval seal
        ctx.beginPath(); ctx.arc(650,420,60,0,Math.PI*2);
        ctx.strokeStyle="rgba(200,0,0,0.5)"; ctx.lineWidth=5; ctx.stroke();
        ctx.font="bold 18px Arial"; ctx.fillStyle="rgba(200,0,0,0.5)";
        ctx.fillText("APPROVED",650,425);
    };

    masterBtn.addEventListener('click', () => {
        const name = document.getElementById('name').value;
        if(!name) return alert("Please enter a name");
        masterBtn.disabled=true; masterBtn.innerText="Processing...";
        const serial = generateSerial();
        renderCertificate(name, serial);
        downloadBtn.classList.remove('hidden');
        masterBtn.disabled=false; masterBtn.innerText="Generate Certificate & Verify Identity";
    });

    downloadBtn.addEventListener('click', () => {
        const imgData = canvas.toDataURL('image/png');
        const pdf = new jspdf.jsPDF('landscape','px',[800,560]);
        pdf.addImage(imgData,'PNG',0,0,800,560);
        pdf.save(`HFL_CERT_${Date.now()}.pdf`);
    });

    renderCertificate("Sample Name","HFL-XXXX-XXXX");
};
</script>

</body>
</html>
