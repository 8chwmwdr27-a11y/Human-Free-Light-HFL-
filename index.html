<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HFL – Certificate</title>

<style>
:root { --gold:#d4af37; --neon:#0ff; --bg:#0a0a0c; }
body { margin:0; font-family:'Segoe UI'; background:var(--bg); color:#fff; }

.app-container { max-width:1000px; margin:40px auto; padding:30px; background:rgba(255,255,255,0.03); border-radius:20px; border:1px solid rgba(0,255,255,0.1); }
.grid { display:grid; grid-template-columns:1fr 1.5fr; gap:30px; }

input,button { padding:12px; border-radius:8px; border:none; }
button { background:var(--neon); font-weight:bold; cursor:pointer; }
.hidden { display:none; }

#certCanvas { width:100%; background:#fff; border:2px solid var(--gold); }
</style>
</head>

<body>

<div class="app-container">
<h2>HFL TERMINAL</h2>

<div class="grid">
<div>
<input id="name" placeholder="Full Name">
<button id="btn">Generate</button>
<button id="download" class="hidden">Download PDF</button>
</div>

<canvas id="certCanvas" width="800" height="560"></canvas>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const canvas = document.getElementById("certCanvas");
const ctx = canvas.getContext("2d");

// --- Serial ---
const genSerial = () => "HFL-" + Math.floor(Math.random()*999999);

// --- ASCII Binary Figure with Glitch ---
const drawBinaryFigure = () => {
    ctx.save();

    const x0=80, y0=180, w=160, h=200;
    // frame with glow
    ctx.shadowColor="rgba(0,255,255,0.3)";
    ctx.shadowBlur=15;
    ctx.strokeStyle="#003366";
    ctx.lineWidth=2;
    ctx.strokeRect(x0,y0,w,h);

    // binary figure
    ctx.font="10px monospace";
    ctx.textBaseline="top";
    for(let i=0;i<20;i++){
        let line="";
        for(let j=0;j<20;j++){
            line += Math.random()>0.5 ? "1":"0";
        }
        // glitch effect: random horizontal shift
        ctx.fillStyle="rgba(0,0,0,"+ (0.3 + Math.random()*0.2) +")";
        ctx.fillText(line, x0 + 10 + Math.random()*3, y0 + 10 + i*10);
    }

    // blur overlay
    ctx.fillStyle="rgba(255,255,255,0.5)";
    ctx.fillRect(x0,y0,w,h);

    ctx.restore();
};

// --- Render Certificate ---
const render = (name,serial)=>{
    ctx.clearRect(0,0,800,560);

    // paper
    ctx.fillStyle="#F9F9F7";
    ctx.fillRect(0,0,800,560);

    // border
    ctx.strokeStyle="#d4af37";
    ctx.lineWidth=10;
    ctx.strokeRect(20,20,760,520);
    ctx.lineWidth=2;
    ctx.strokeRect(40,40,720,480);

    // title
    ctx.fillStyle="#000";
    ctx.textAlign="center";
    ctx.font="bold 42px serif";
    ctx.fillText("HUMAN FREE LIGHT",400,100);

    ctx.font="22px sans-serif";
    ctx.fillText("OFFICIAL CERTIFICATE",400,140);

    // name
    ctx.font="bold 40px serif";
    ctx.fillText(name,400,260);

    // ASCII figure
    drawBinaryFigure();

    // message
    ctx.font="bold 16px monospace";
    ctx.fillStyle="#003366";
    ctx.fillText("KEEP YOUR IDENTITY PRIVATE",400,350);

    // serial
    ctx.font="14px monospace";
    ctx.fillStyle="#666";
    ctx.fillText("Serial: "+serial,400,480);

    // watermark subtle diagonal
    ctx.save();
    ctx.translate(400,280);
    ctx.rotate(-Math.PI/6);
    ctx.font="bold 70px serif";
    ctx.fillStyle="rgba(0,0,0,0.02)";
    ctx.fillText("HFL OFFICIAL SYSTEM",0,0);
    ctx.restore();
};

document.getElementById("btn").onclick=()=>{
    const name=document.getElementById("name").value;
    if(!name) return alert("enter name");
    const serial=genSerial();
    render(name,serial);
    document.getElementById("download").classList.remove("hidden");
};

document.getElementById("download").onclick=()=>{
    const pdf = new jspdf.jsPDF('landscape','px',[800,560]);
    pdf.addImage(canvas.toDataURL(),'PNG',0,0,800,560);
    pdf.save("HFL_CERT.pdf");
};

// initial sample
render("Sample Name","HFL-XXXX");
</script>

</body>
</html>
