<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HFL – User Portal</title>

<style>
:root { --gold:#d4af37; --neon:#0ff; --bg:#0a0a0c; }
body { margin:0; font-family:'Segoe UI'; background:var(--bg); color:#fff; }

.app-container { max-width:1000px; margin:40px auto; padding:30px; background:rgba(255,255,255,0.03); border-radius:20px; border:1px solid rgba(0,255,255,0.1); }
.grid { display:grid; grid-template-columns:1fr 1.5fr; gap:30px; }

input,button { padding:12px; border-radius:8px; border:none; }
button { background:var(--neon); font-weight:bold; cursor:pointer; }
.hidden { display:none; }

#certCanvas { width:100%; background:#fff; border:2px solid var(--gold); margin-bottom:10px; }
#chat { height:200px; overflow-y:auto; background:rgba(0,0,0,0.2); padding:10px; border-radius:10px; margin-top:15px; }
.message { margin:3px 0; }
.message span { font-weight:bold; }
.status-dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; background:#0f0; animation:blink 1s infinite; }
@keyframes blink { 0%,50%,100% { opacity:1; } 25%,75% { opacity:0; } }
</style>
</head>
<body>

<div class="app-container">
<h2>HFL USER PORTAL</h2>

<div class="grid">
<div>
<input id="username" placeholder="Enter your name">
<button id="loginBtn">Login</button>

<div id="userPanel" class="hidden">
    <input id="name" placeholder="Full Name">
    <button id="generateBtn">Generate Certificate</button>
    <button id="downloadBtn" class="hidden">Download PDF</button>
    <div id="chat"></div>
<div>
    <input id="name" placeholder="Full Name">
    <button id="btn">Generate</button>
    <button id="download" class="hidden">Download PDF</button>

    <!-- Admin Login Button -->
    <button id="adminBtn" style="
        background: #d4af37; 
        color: #000; 
        padding: 12px 20px; 
        border-radius: 8px; 
        font-weight: bold; 
        margin-top: 15px;
        cursor: pointer;
        border: none;
    ">Admin Login</button>
</div>
</div>
</div>

<canvas id="certCanvas" width="800" height="560"></canvas>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyCe6AIaouRgKfdsK6IEI6in316B52rO778",
  authDomain: "hflsystem.firebaseapp.com",
  projectId: "hflsystem",
  storageBucket: "hflsystem.firebasestorage.app",
  messagingSenderId: "469775027908",
  appId: "1:469775027908:web:f3501f10942f58ba18c391"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// --- Login ---
let currentUser = null;
const loginBtn = document.getElementById('loginBtn');
const usernameInput = document.getElementById('username');
loginBtn.onclick = async () => {
    const name = usernameInput.value.trim();
    if(!name) return alert("Enter your name");
    currentUser = name;
    document.getElementById('userPanel').classList.remove('hidden');

    // Add user if not exists
    const userRef = db.collection('users').doc(currentUser);
    const userSnap = await userRef.get();
    if(!userSnap.exists){
        await userRef.set({name:currentUser, approved:false, requested:false, joinedAt:firebase.firestore.FieldValue.serverTimestamp()});
    }

    // Listen for chat messages and approval
    db.collection('messages').orderBy('timestamp').onSnapshot(snapshot=>{
        const chat = document.getElementById('chat');
        chat.innerHTML = '';
        snapshot.forEach(doc=>{
            const msg = doc.data();
            if(msg.approved){
                const div = document.createElement('div');
                div.classList.add('message');
                div.innerHTML = `<span>${msg.name}:</span> ${msg.text}`;
                chat.appendChild(div);
                chat.scrollTop = chat.scrollHeight;
            }
        });
    });

    // Approval listener
    userRef.onSnapshot(doc=>{
        const data = doc.data();
        if(data.approved) document.getElementById('chat').insertAdjacentHTML('beforebegin','<div style="color:var(--gold)">✅ You are approved for chat!</div>');
    });
};

// --- Certificate ---
const canvas = document.getElementById("certCanvas");
const ctx = canvas.getContext("2d");
const nameInput = document.getElementById("name");
const generateBtn = document.getElementById("generateBtn");
const downloadBtn = document.getElementById("downloadBtn");

const genSerial = () => "HFL-" + Math.floor(Math.random()*999999);

const drawBinaryFigure = () => {
    ctx.save();
    ctx.strokeStyle="#003366";
    ctx.lineWidth=2;
    ctx.strokeRect(80,180,160,200);

    ctx.font="10px monospace";
    ctx.fillStyle="rgba(0,0,0,0.4)";
    let y=200;
    for(let i=0;i<20;i++){
        let line="";
        for(let j=0;j<20;j++) line += Math.random()>0.5 ? "1":"0";
        ctx.fillText(line,90,y);
        y+=10;
    }

    ctx.fillStyle="rgba(255,255,255,0.6)";
    ctx.fillRect(80,180,160,200);
    ctx.restore();
};

const render = (name,serial)=>{
    ctx.clearRect(0,0,800,560);
    ctx.fillStyle="#F9F9F7";
    ctx.fillRect(0,0,800,560);
    ctx.strokeStyle="#d4af37";
    ctx.lineWidth=10;
    ctx.strokeRect(20,20,760,520);
    ctx.lineWidth=2;
    ctx.strokeRect(40,40,720,480);

    ctx.fillStyle="#000";
    ctx.textAlign="center";
    ctx.font="bold 42px serif";
    ctx.fillText("HUMAN FREE LIGHT",400,100);
    ctx.font="22px sans-serif";
    ctx.fillText("OFFICIAL CERTIFICATE",400,140);

    ctx.font="bold 40px serif";
    ctx.fillText(name,400,260);

    drawBinaryFigure();

    ctx.font="bold 16px monospace";
    ctx.fillStyle="#003366";
    ctx.fillText("KEEP YOUR IDENTITY PRIVATE",400,350);

    ctx.font="14px monospace";
    ctx.fillStyle="#666";
    ctx.fillText("Serial: "+serial,400,480);
};

generateBtn.onclick=()=>{
    if(!nameInput.value) return alert("Enter your full name");
    const serial = genSerial();
    render(nameInput.value, serial);

    // Send certificate request for approval
    db.collection('users').doc(currentUser).update({requested:true});
    downloadBtn.classList.remove('hidden');
};

downloadBtn.onclick=()=>{
    const pdf = new jspdf.jsPDF('landscape','px',[800,560]);
    pdf.addImage(canvas.toDataURL(),'PNG',0,0,800,560);
    pdf.save("HFL_CERT.pdf");
};
</script>

</body>
</html>
