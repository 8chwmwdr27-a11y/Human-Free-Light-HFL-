<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HFL SUS Platform</title>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  body { font-family:'Segoe UI', sans-serif; margin:0; background:#0d1117; color:#c9d1d9; }
  header { display:flex; justify-content:space-between; padding:10px 20px; background:#161b22; align-items:center; }
  nav a { margin:0 10px; text-decoration:none; color:#58a6ff; font-weight:bold; transition:0.3s; }
  nav a:hover { color:#1f6feb; }
  .container { padding:20px; }
  .tab { display:none; }
  .tab.active { display:block; animation:fadeIn 0.5s; }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  button { background:#238636; color:white; border:none; padding:8px 14px; margin:5px; cursor:pointer; border-radius:5px; transition:0.3s; }
  button:hover { background:#2ea043; }
  input, textarea { padding:8px; margin:5px 0; border-radius:4px; border:1px solid #30363d; background:#0d1117; color:#c9d1d9; width:100%; }
  .success { color:#39d353; font-weight:bold; animation:pulse 0.5s; }
  @keyframes pulse { 0%{transform:scale(0.95);} 50%{transform:scale(1.05);} 100%{transform:scale(1);} }
  .chat { border:1px solid #30363d; padding:10px; border-radius:5px; height:300px; overflow-y:auto; background:#161b22; }
  .message { margin:5px 0; }
  .online-dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:5px; }
  .blue { background:#58a6ff; }
  .green { background:#39d353; }
  .card { border:1px solid #30363d; border-radius:5px; padding:10px; margin:5px; background:#161b22; }
</style>
</head>
<body>

<header>
  <div><strong>HFL SUS Platform</strong></div>
  <nav>
    <a href="#" onclick="openTab('register')">Register</a>
    <a href="#" onclick="openTab('login')">Login</a>
    <a href="#" onclick="openTab('profile')">Profile</a>
    <a href="#" onclick="openTab('publicChat')">Public Chat</a>
    <a href="#" onclick="openTab('privateChat')">Private Chat</a>
    <a href="#" onclick="openTab('alliances')">Alliances</a>
    <a href="#" onclick="openTab('code')">Code Legislation</a>
  </nav>
</header>

<div class="container">
  <!-- Register -->
  <div id="register" class="tab">
    <h2>Register</h2>
    <input type="email" id="regEmail" placeholder="Email">
    <input type="password" id="regPassword" placeholder="Password">
    <button onclick="register()">Sign Up</button>
    <div id="regMsg"></div>
  </div>

  <!-- Login -->
  <div id="login" class="tab">
    <h2>Login</h2>
    <input type="email" id="logEmail" placeholder="Email">
    <input type="password" id="logPassword" placeholder="Password">
    <button onclick="login()">Login</button>
    <div id="logMsg"></div>
  </div>

  <!-- Profile -->
  <div id="profile" class="tab">
    <h2>Profile</h2>
    <div id="userInfo"></div>
  </div>

  <!-- Public Chat -->
  <div id="publicChat" class="tab">
    <h2>Public Chat</h2>
    <div class="chat" id="publicChatBox"></div>
    <input type="text" id="publicMsg" placeholder="Type message...">
    <button onclick="sendPublic()">Send</button>
  </div>

  <!-- Private Chat -->
  <div id="privateChat" class="tab">
    <h2>Private Chat</h2>
    <div class="chat" id="privateChatBox"></div>
    <input type="text" id="privateMsg" placeholder="Type private message...">
    <button onclick="sendPrivate()">Send</button>
  </div>

  <!-- Alliances -->
  <div id="alliances" class="tab">
    <h2>Alliances</h2>
    <div id="alliancesList"></div>
  </div>

  <!-- Code Legislation -->
  <div id="code" class="tab">
    <h2>Code Legislation</h2>
    <div id="codeProposals"></div>
    <textarea id="proposalInput" placeholder="Your suggestion..."></textarea>
    <button onclick="sendProposal()">Submit</button>
  </div>
</div>

<script>
  // Firebase Config
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    databaseURL: "YOUR_DB_URL",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MSG_ID",
    appId: "YOUR_APP_ID"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  // Tabs
  function openTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
  }

  // Register
  function register() {
    const email = document.getElementById('regEmail').value;
    const password = document.getElementById('regPassword').value;
    auth.createUserWithEmailAndPassword(email, password)
      .then(res => { document.getElementById('regMsg').innerHTML='<span class="success">Registered!</span>'; })
      .catch(err => { document.getElementById('regMsg').textContent = err.message; });
  }

  // Login
  function login() {
    const email = document.getElementById('logEmail').value;
    const password = document.getElementById('logPassword').value;
    auth.signInWithEmailAndPassword(email, password)
      .then(res => { document.getElementById('logMsg').innerHTML='<span class="success">Logged in!</span>'; loadProfile(); loadPrivateChat(); })
      .catch(err => { document.getElementById('logMsg').textContent = err.message; });
  }

  // Load Profile
  function loadProfile() {
    const user = auth.currentUser;
    if(user){ document.getElementById('userInfo').innerHTML = 'Email: '+user.email; }
  }

  // Public Chat
  const chatRef = db.ref('publicChat');
  chatRef.on('child_added', snapshot => {
    const msg = snapshot.val();
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message');
    msgDiv.textContent = msg.email + ': ' + msg.text;
    document.getElementById('publicChatBox').appendChild(msgDiv);
    document.getElementById('publicChatBox').scrollTop = document.getElementById('publicChatBox').scrollHeight;
  });
  function sendPublic() {
    const user = auth.currentUser;
    const text = document.getElementById('publicMsg').value;
    if(user && text){
      chatRef.push({ email:user.email, text:text });
      document.getElementById('publicMsg').value='';
    }
  }

  // Private Chat
  const privateRef = db.ref('privateChat');
  privateRef.on('child_added', snap => {
    const msg = snap.val();
    const div = document.createElement('div');
    div.textContent = msg.email + ': ' + msg.text;
    document.getElementById('privateChatBox').appendChild(div);
    document.getElementById('privateChatBox').scrollTop = document.getElementById('privateChatBox').scrollHeight;
  });
  function sendPrivate() {
    const user = auth.currentUser;
    const text = document.getElementById('privateMsg').value;
    if(user && text){
      privateRef.push({ email:user.email, text:text });
      document.getElementById('privateMsg').value='';
    }
  }

  // Alliances (SUS placeholder)
  const allianceRef = db.ref('alliances');
  allianceRef.on('child_added', snap => {
    const data = snap.val();
    const div = document.createElement('div');
    div.classList.add('card');
    div.textContent = data.email + ' formed alliance with ' + data.with;
    document.getElementById('alliancesList').appendChild(div);
  });

  // Code Legislation
  const codeRef = db.ref('codeProposals');
  codeRef.on('child_added', snap => {
    const data = snap.val();
    const div = document.createElement('div');
    div.classList.add('card');
    div.textContent = data.email + ': ' + data.text;
    document.getElementById('codeProposals').appendChild(div);
  });
  function sendProposal(){
    const user = auth.currentUser;
    const text = document.getElementById('proposalInput').value;
    if(user && text){
      codeRef.push({ email:user.email, text:text });
      document.getElementById('proposalInput').value='';
    }
  }

  openTab('register');
</script>
</body>
</html>
