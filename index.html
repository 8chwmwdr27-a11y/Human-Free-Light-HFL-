<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Human Free Light HFL</title>
<style>
  /* סגנון גוף בסיסי */
  body {
    margin: 0;
    font-family: "Arial", sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #fff;
    overflow-x: hidden;
  }

  h1, h2, h3 { 
    text-align: center; 
    margin: 10px 0; 
    text-shadow: 0 0 10px #0ff;
  }

  .container {
    max-width: 900px;
    margin: 50px auto;
    padding: 20px;
    background: rgba(0,0,0,0.6);
    border-radius: 15px;
    box-shadow: 0 0 20px #0ff;
    animation: glow 3s infinite alternate;
  }

  @keyframes glow {
    from { box-shadow: 0 0 20px #0ff; }
    to { box-shadow: 0 0 40px #0ff; }
  }

  input, button, textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
    border: none;
    outline: none;
    font-size: 16px;
  }

  input, textarea {
    background: rgba(255,255,255,0.1);
    color: #fff;
  }

  input::placeholder, textarea::placeholder {
    color: #0ff;
  }

  button {
    background: #0ff;
    color: #000;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background: #0cc;
    box-shadow: 0 0 15px #0ff;
  }

  .card {
    background: rgba(0,0,0,0.4);
    border-radius: 15px;
    padding: 20px;
    margin: 20px 0;
    box-shadow: 0 0 20px #0ff inset;
    animation: pulse 2s infinite alternate;
  }

  @keyframes pulse {
    from { box-shadow: 0 0 15px #0ff inset; }
    to { box-shadow: 0 0 30px #0ff inset; }
  }

</style>
</head>
<body>

<div class="container">
  <h1>🌐 Human Free Light (HFL)</h1>
  <h2>הזדמנות לחיים חופשיים</h2>
  
  <div class="card">
    <h3>💌 הצהרת נאמנות</h3>
    <p>
      HFL היא אלטרנטיבה לממסד, הזדמנות להצטרף לארגון ולחיות בנאמנות לו. החיים בנאמנות כוללים ליווי מקצועי, תעודת HFL ומכתב התפטרות מהמערכת הקיימת.
    </p>
  </div>

  <div class="card">
    <h3>📝 צור את תעודת HFL שלך</h3>
    <input type="text" id="name" placeholder="שמך המלא">
    <input type="text" id="email" placeholder="אימייל">
    <textarea id="message" placeholder="הצהרה אישית / מכתב"></textarea>
    <button id="createCertificate">צור תעודה</button>
  </div>

  <div class="card">
    <h3>📄 תעודה מוכנה:</h3>
    <pre id="certificateOutput"></pre>
    <button id="downloadPDF">⬇ הורד PDF</button>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"></script>

<script>
  // 🔹 כאן תדביק את הקוד שקיבלת מ-Firebase במקום הסוגריים:
  const firebaseConfig = {
    // לדוגמה:
    // apiKey: "AIzaSyCe6AIaouRgKfdsK6IEI6in316B52rO778",
    // authDomain: "hflsystem.firebaseapp.com",
    // projectId: "hflsystem",
    // storageBucket: "hflsystem.firebasestorage.app",
    // messagingSenderId: "469775027908",
    // appId: "1:469775027908:web:f3501f10942f58ba18c391"
  };

  const app = firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // 🔹 פונקציה בסיסית ליצירת תעודה
  document.getElementById('createCertificate').addEventListener('click', () => {
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const message = document.getElementById('message').value;

    if (!name || !email) {
      alert("נא למלא שם ואימייל");
      return;
    }

    const certText = `
🌐 Human Free Light (HFL)
תעודת HFL למשתמש: ${name} (${email})

הצהרה אישית:
${message}

🕊 אתה חופשי מהמערכת הקיימת ומצטרף לאלטרנטיבה HFL.
`;

    document.getElementById('certificateOutput').textContent = certText;

    // שמירה ב-Firestore
    db.collection('certificates').add({
      name,
      email,
      message,
      createdAt: firebase.firestore.Timestamp.now()
    }).then(() => {
      console.log("תעודה נשמרה בהצלחה ב-Firebase!");
    }).catch(err => console.error(err));
  });

  // 🔹 הורדה כ-PDF (פשוטה)
  document.getElementById('downloadPDF').addEventListener('click', () => {
    const content = document.getElementById('certificateOutput').textContent;
    const blob = new Blob([content], {type: "application/pdf"});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = "HFL_Certificate.pdf";
    link.click();
  });
</script>

</body>
</html>
