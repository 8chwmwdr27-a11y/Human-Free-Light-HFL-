<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HFL Social Full</title>
<style>
/* =============================
   GLOBAL STYLES
============================= */
body {margin:0;padding:0;font-family:'Segoe UI',sans-serif;background:#f0f2f5;color:#333;}
header{display:none;}
main{display:flex;flex-direction:column;align-items:center;width:100%;max-width:500px;margin:0 auto;position:relative;}
.card{background:#fff;padding:1em;margin:1em 0;border-radius:15px;box-shadow:0 3px 8px rgba(0,0,0,0.2);width:95%;}
input,button,textarea{width:100%;padding:0.7em;margin:0.5em 0;border-radius:8px;border:1px solid #ccc;font-size:1em;}
button{background:#ff6b6b;color:#fff;font-weight:bold;cursor:pointer;transition:0.3s;}
button:hover{background:#ff4757;}
textarea{resize:none;}
.avatar{width:40px;height:40px;border-radius:50%;margin-right:0.5em;display:flex;justify-content:center;align-items:center;font-weight:bold;color:#fff;background:#1e90ff;}
.message{display:flex;align-items:flex-start;margin:0.5em 0;}
.chat-box{height:300px;overflow-y:auto;padding:0.5em;border:1px solid #ccc;border-radius:10px;background:#f9f9f9;}
.friend-list{max-height:150px;overflow-y:auto;}
.friend-item{display:flex;justify-content:space-between;align-items:center;padding:0.3em 0;border-bottom:1px solid #eee;}
.story-container{display:flex;overflow-x:auto;margin:0.5em 0;}
.story{width:60px;height:60px;border-radius:50%;margin-right:0.5em;overflow:hidden;cursor:pointer;}
.story img{width:100%;height:100%;object-fit:cover;}
.post{padding:0.5em;margin:0.5em 0;border-radius:10px;background:#f7f7f7;}
nav{position:fixed;bottom:0;left:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:0.5em 0;border-top:1px solid #ccc;}
nav button{background:none;color:#333;font-weight:bold;font-size:0.9em;width:100%;border:none;cursor:pointer;}
nav button.active{color:#ff6b6b;}
.hidden{display:none;}
.profile-pic{width:60px;height:60px;border-radius:50%;margin-bottom:0.5em;}
</style>
</head>
<body>

<main>

<!-- Auth -->
<div class="card" id="auth-card">
<h2>כניסה / הרשמה</h2>
<input type="email" id="email" placeholder="אימייל">
<input type="password" id="password" placeholder="סיסמה">
<button id="login-btn">התחבר</button>
<button id="signup-btn">הרשם</button>
<p id="auth-msg"></p>
</div>

<!-- APP -->
<div id="app" class="hidden">

<!-- Pages -->
<div id="page-home" class="card page">
<h3>פיד</h3>
<textarea id="new-post" placeholder="מה חדש?"></textarea>
<button id="post-btn">פרסם</button>
<div id="posts"></div>
</div>

<div id="page-stories" class="card page hidden">
<h3>סטוריז</h3>
<div id="stories" class="story-container"></div>
</div>

<div id="page-friends" class="card page hidden">
<h3>רשימת חברים</h3>
<div id="friends" class="friend-list"></div>
</div>

<div id="page-chat" class="card page hidden">
<h3>צ׳אט ציבורי</h3>
<div class="chat-box" id="chat-box"></div>
<input type="text" id="chat-input" placeholder="כתוב הודעה...">
<button id="send-btn">שלח</button>
</div>

<div id="page-profile" class="card page hidden">
<h3>פרופיל אישי</h3>
<img id="profile-pic" src="https://via.placeholder.com/60" class="profile-pic">
<input type="text" id="username" placeholder="שם משתמש">
<textarea id="bio" placeholder="ביוגרפיה קצרה"></textarea>
<input type="file" id="profile-upload">
<button id="update-profile">עדכן פרופיל</button>
<button id="logout-btn" style="background:#ff6b6b;">התנתק</button>
</div>

</div>

</main>

<!-- Navigation -->
<nav>
<button id="nav-home" class="active">בית</button>
<button id="nav-stories">סטוריז</button>
<button id="nav-friends">חברים</button>
<button id="nav-chat">צ׳אט</button>
<button id="nav-profile">פרופיל</button>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
import { getDatabase, ref, push, set, onValue, onChildAdded, update } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

// ===== Firebase Config =====
const firebaseConfig = {
  apiKey: "AIzaSyCe6AIaouRgKfdsK6IEI6in316B52rO778",
  authDomain: "hflsystem.firebaseapp.com",
  databaseURL: "https://hflsystem-default-rtdb.firebaseio.com",
  projectId: "hflsystem",
  storageBucket: "hflsystem.firebasestorage.app",
  messagingSenderId: "469775027908",
  appId: "1:469775027908:web:f3501f10942f58ba18c391",
  measurementId: "G-G4W68NT5T2"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

// ===== Elements =====
const authCard=document.getElementById("auth-card");
const emailInput=document.getElementById("email");
const passwordInput=document.getElementById("password");
const loginBtn=document.getElementById("login-btn");
const signupBtn=document.getElementById("signup-btn");
const authMsg=document.getElementById("auth-msg");

const appDiv=document.getElementById("app");
const pages=document.querySelectorAll(".page");

const navHome=document.getElementById("nav-home");
const navStories=document.getElementById("nav-stories");
const navFriends=document.getElementById("nav-friends");
const navChat=document.getElementById("nav-chat");
const navProfile=document.getElementById("nav-profile");

const postsDiv=document.getElementById("posts");
const newPostInput=document.getElementById("new-post");
const postBtn=document.getElementById("post-btn");

const storiesDiv=document.getElementById("stories");
const friendsDiv=document.getElementById("friends");

const chatBox=document.getElementById("chat-box");
const chatInput=document.getElementById("chat-input");
const sendBtn=document.getElementById("send-btn");

const profilePic=document.getElementById("profile-pic");
const usernameInput=document.getElementById("username");
const bioInput=document.getElementById("bio");
const updateProfileBtn=document.getElementById("update-profile");
const profileUpload=document.getElementById("profile-upload");
const logoutBtn=document.getElementById("logout-btn");

// ===== Navigation =====
function showPage(pageId){
pages.forEach(p=>p.classList.add("hidden"));
document.getElementById(pageId).classList.remove("hidden");
navHome.classList.remove("active");
navStories.classList.remove("active");
navFriends.classList.remove("active");
navChat.classList.remove("active");
navProfile.classList.remove("active");
if(pageId=="page-home") navHome.classList.add("active");
if(pageId=="page-stories") navStories.classList.add("active");
if(pageId=="page-friends") navFriends.classList.add("active");
if(pageId=="page-chat") navChat.classList.add("active");
if(pageId=="page-profile") navProfile.classList.add("active");
}
navHome.onclick=()=>showPage("page-home");
navStories.onclick=()=>showPage("page-stories");
navFriends.onclick=()=>showPage("page-friends");
navChat.onclick=()=>showPage("page-chat");
navProfile.onclick=()=>showPage("page-profile");

// ===== Auth =====
signupBtn.onclick=()=>{
createUserWithEmailAndPassword(auth,emailInput.value,passwordInput.value)
.then(cred=>{
authMsg.textContent="נרשמת בהצלחה!";
initUser(cred.user);
})
.catch(err=>authMsg.textContent=err.message);
};

loginBtn.onclick=()=>{
signInWithEmailAndPassword(auth,emailInput.value,passwordInput.value)
.then(cred=>initUser(cred.user))
.catch(err=>authMsg.textContent=err.message);
};

logoutBtn.onclick=()=>signOut(auth).then(()=>location.reload());

// ===== Init User =====
function initUser(user){
authCard.style.display="none";
appDiv.classList.remove("hidden");
set(ref(db,"users/"+user.uid),{
email:user.email,
online:true,
username:user.email.split("@")[0],
profilePic:profilePic.src,
bio:""
});
updatePosts();
updateStories();
updateFriends();
updateProfileUI(user);
updateChat();
}

// ===== Profile =====
function updateProfileUI(user){
onValue(ref(db,"users/"+user.uid),snapshot=>{
const data=snapshot.val();
if(data){
profilePic.src=data.profilePic||"https://via.placeholder.com/60";
usernameInput.value=data.username||user.email.split("@")[0];
bioInput.value=data.bio||"";
}
});
}

updateProfileBtn.onclick=()=>{
const user=auth.currentUser;
const reader=new FileReader();
if(profileUpload.files[0]){
reader.readAsDataURL(profileUpload.files[0]);
reader.onload=()=>{ 
update(ref(db,"users/"+user.uid),{
username:usernameInput.value,
bio:bioInput.value,
profilePic:reader.result
});
};
}else{
update(ref(db,"users/"+user.uid),{
username:usernameInput.value,
bio:bioInput.value
});
}
};

// ===== Posts =====
postBtn.onclick=()=>{
const user=auth.currentUser;
if(newPostInput.value.trim()==="") return;
push(ref(db,"posts"),{
text:newPostInput.value,
sender:user.email,
avatar:user.email[0].toUpperCase(),
time:new Date().toLocaleTimeString()
});
newPostInput.value="";
};

function updatePosts(){
onValue(ref(db,"posts"),snapshot=>{
postsDiv.innerHTML="";
snapshot.forEach(snap=>{
const post=snap.val();
const div=document.createElement("div");
div.className="post";
div.innerHTML=`<div style="display:flex;align-items:center;margin-bottom:0.5em;"><div class="avatar">${post.avatar}</div><b>${post.sender}</b> <span style="font-size:0.8em;margin-left:5px;">${post.time}</span></div><p>${post.text}</p>`;
postsDiv.appendChild(div);
});
});
}

// ===== Stories =====
const storyImages=[
"https://picsum.photos/id/237/100",
"https://picsum.photos/id/238/100",
"https://picsum.photos/id/239/100",
"https://picsum.photos/id/240/100",
"https://picsum.photos/id/241/100",
"https://picsum.photos/id/242/100"
];

function updateStories(){
storiesDiv.innerHTML="";
for(let i=0;i<storyImages.length;i++){
const s=document.createElement("div");
s.className="story";
const img=document.createElement("img");
img.src=storyImages[i];
s.appendChild(img);
storiesDiv.appendChild(s);
}
}

// ===== Friends =====
function updateFriends(){
onValue(ref(db,"users"),snapshot=>{
friendsDiv.innerHTML="";
snapshot.forEach(snap=>{
const user=snap.val();
if(!user.email.startsWith("bot_")){
const div=document.createElement("div");
div.className="friend-item";
div.innerHTML=`<span>${user.username||user.email}</span><button onclick="addFriend('${snap.key}')">הוסף</button>`;
friendsDiv.appendChild(div);
}
});
});
}

window.addFriend=(uid)=>{
const current=auth.currentUser;
set(ref(db,"users/"+current.uid+"/friends/"+uid),true);
alert("המשתמש נוסף לחברים!");
};

// ===== Chat =====
sendBtn.onclick=()=>{
const user=auth.currentUser;
if(chatInput.value.trim()==="") return;
push(ref(db,"chat"),{
text:chatInput.value,
sender:user.username||user.email,
avatar:user.username?user.username[0].toUpperCase():user.email[0].toUpperCase(),
time:new Date().toLocaleTimeString()
});
chatInput.value="";
};

function updateChat(){
onChildAdded(ref(db,"chat"),data=>{
const msg=data.val();
const div=document.createElement("div");
div.className="message";
div.innerHTML=`<div class="avatar">${msg.avatar}</div><div><b>${msg.sender}</b>: ${msg.text}</div>`;
chatBox.appendChild(div);
chatBox.scrollTop=chatBox.scrollHeight;
});
}

// ===== Bots 5 =====
const bots=[
{name:"Alice",pic:"https://i.pravatar.cc/60?img=1"},
{name:"Bob",pic:"https://i.pravatar.cc/60?img=2"},
{name:"Charlie",pic:"https://i.pravatar.cc/60?img=3"},
{name:"Dana",pic:"https://i.pravatar.cc/60?img=4"},
{name:"Eli",pic:"https://i.pravatar.cc/60?img=5"}
];
const botMessages=["שלום לכולם!","איך הולך?","מישהו כאן?","איזה יום יפה היום","חחח","ממש מגניב!","אני מסכים"];
bots.forEach(bot=>{
function botAct(){
const msg=botMessages[Math.floor(Math.random()*botMessages.length)];
push(ref(db,"chat"),{text:msg,sender:bot.name,avatar:bot.name[0].toUpperCase(),time:new Date().toLocaleTimeString()});
push(ref(db,"posts"),{text:msg,sender:bot.name,avatar:bot.name[0].toUpperCase(),time:new Date().toLocaleTimeString()});
set(ref(db,"users/bot_"+bot.name),{email:bot.name,username:bot.name,online:true,profilePic:bot.pic});
setTimeout(botAct,Math.random()*10000+5000);
}
botAct();
});

// ===== Monitor Auth =====
onAuthStateChanged(auth,user=>{
if(user){initUser(user);}
});
</script>
</body>
</html>
