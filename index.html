<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HFL – Certificate</title>

<style>
:root { --gold:#d4af37; --neon:#0ff; --bg:#0a0a0c; }
body { margin:0; font-family:'Segoe UI'; background:var(--bg); color:#fff; }

.app-container { max-width:1000px; margin:40px auto; padding:30px; background:rgba(255,255,255,0.03); border-radius:20px; border:1px solid rgba(0,255,255,0.1); }
.grid { display:grid; grid-template-columns:1fr 1.5fr; gap:30px; }

input,button { padding:12px; border-radius:8px; border:none; }
button { background:var(--neon); font-weight:bold; cursor:pointer; }
.hidden { display:none; }

#certCanvas { width:100%; background:#fff; border:2px solid var(--gold); border-radius:10px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);}
</style>
</head>

<body>

<div class="app-container">
<h2>HFL TERMINAL</h2>

<div class="grid">
<!-- User Section -->
<div>
    <input id="name" placeholder="Full Name">
    <button id="btn">Generate Certificate</button>
    <button id="download" class="hidden">Download PDF</button>

    <!-- Admin Login Button -->
    <button id="adminBtn" style="
        background: #d4af37; 
        color: #000; 
        padding: 12px 20px; 
        border-radius: 8px; 
        font-weight: bold; 
        margin-top: 15px;
        cursor: pointer;
        border: none;
    ">Admin Login</button>
</div>

<!-- Certificate Preview -->
<canvas id="certCanvas" width="800" height="560"></canvas>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const canvas = document.getElementById("certCanvas");
const ctx = canvas.getContext("2d");

// --- Generate Serial ---
const genSerial = () => "HFL-" + Math.floor(Math.random()*999999);

// --- Draw Binary Figure ---
const drawBinaryFigure = () => {
    ctx.save();

    // Frame
    ctx.strokeStyle="#003366";
    ctx.lineWidth=2;
    ctx.strokeRect(80,180,160,200);

    // Binary "figure"
    ctx.font="10px monospace";
    ctx.fillStyle="rgba(0,0,0,0.4)";
    let y=200;
    for(let i=0;i<20;i++){
        let line="";
        for(let j=0;j<20;j++){
            line += Math.random()>0.5 ? "1":"0";
        }
        ctx.fillText(line,90,y);
        y+=10;
    }

    // Fake blur overlay
    ctx.fillStyle="rgba(255,255,255,0.6)";
    ctx.fillRect(80,180,160,200);

    ctx.restore();
};

// --- Render Certificate ---
const render = (name,serial)=>{
    ctx.clearRect(0,0,800,560);

    // Paper background
    ctx.fillStyle="#F9F9F7";
    ctx.fillRect(0,0,800,560);

    // Outer border
    ctx.strokeStyle="#d4af37";
    ctx.lineWidth=10;
    ctx.strokeRect(20,20,760,520);

    // Inner border
    ctx.lineWidth=2;
    ctx.strokeRect(40,40,720,480);

    // Title
    ctx.fillStyle="#000";
    ctx.textAlign="center";
    ctx.font="bold 42px serif";
    ctx.fillText("HUMAN FREE LIGHT",400,100);

    ctx.font="22px sans-serif";
    ctx.fillText("OFFICIAL CERTIFICATE",400,140);

    // Name
    ctx.font="bold 40px serif";
    ctx.fillText(name,400,260);

    // Binary figure
    drawBinaryFigure();

    // Message
    ctx.font="bold 16px monospace";
    ctx.fillStyle="#003366";
    ctx.fillText("KEEP YOUR IDENTITY PRIVATE",400,350);

    // Serial
    ctx.font="14px monospace";
    ctx.fillStyle="#666";
    ctx.fillText("Serial: "+serial,400,480);
};

// --- Generate Certificate ---
document.getElementById("btn").onclick=()=>{
    const name=document.getElementById("name").value;
    if(!name) return alert("Please enter your full name.");

    const serial=genSerial();
    render(name,serial);

    document.getElementById("download").classList.remove("hidden");
};

// --- Download PDF ---
document.getElementById("download").onclick=()=>{
    const pdf = new jspdf.jsPDF('landscape','px',[800,560]);
    pdf.addImage(canvas.toDataURL(),'PNG',0,0,800,560);
    pdf.save("HFL_CERT.pdf");
};

// --- Admin Login ---
document.getElementById('adminBtn').onclick = () => {
    const secret = prompt("Enter admin secret key:");
    if(secret === "HFL_SUPER_SECRET"){ // <-- שנה כאן את הסיסמה שלך
        window.location.href = "admin.html";
    } else {
        alert("Access denied!");
    }
};

// --- Initial Render ---
render("Sample Name","HFL-XXXX");
</script>

</body>
</html>
