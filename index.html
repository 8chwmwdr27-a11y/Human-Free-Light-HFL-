<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HFL ULTRA SYSTEM</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#050816;color:#fff;}
nav{display:flex;gap:15px;background:#0c1028;padding:12px;position:sticky;top:0;}
nav a{color:#fff;text-decoration:none;font-weight:bold;}
section{padding:20px;display:none;}
.active{display:block;}
button{padding:10px;background:#00ffc8;border:none;color:#000;font-weight:bold;cursor:pointer;}
input{padding:8px;margin:5px;}
.chat{height:200px;overflow:auto;background:#111;padding:10px;}
.user{border:1px solid #555;padding:5px;margin:3px;cursor:pointer;}
.online{color:#0f0;}
.pulse{animation:pulse 1s infinite;}
@keyframes pulse{0%{opacity:1}50%{opacity:0.3}100%{opacity:1}}
.toast{position:fixed;bottom:20px;right:20px;background:#0f0;color:#000;padding:10px;display:none;}
</style>
</head>

<body>

<nav>
<a onclick="go('home')">Home</a>
<a onclick="go('auth')">Login</a>
<a onclick="go('chat')">Chat</a>
<a onclick="go('hierarchy')">Hierarchy</a>
<a onclick="go('legislation')">Legislation</a>
<a onclick="go('profile')">Profile</a>
</nav>

<section id="home" class="active">
<h1>HFL SYSTEM 🌐</h1>
Members: <span id="count">0</span>
</section>

<section id="auth">
<h2>Login / Sign Up</h2>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="signup()">Sign Up</button>
</section>

<section id="chat">
<h2>Global Chat 💬</h2>
<div id="chatBox" class="chat"></div>
<input id="msg"><button onclick="send()">Send</button>
</section>

<section id="hierarchy">
<h2>Hierarchy 🧠</h2>
<div id="users"></div>
</section>

<section id="legislation">
<h2>Legislation ⚖️</h2>
<button onclick="joinLaw()">Join</button>
<div id="lawList"></div>
</section>

<section id="profile">
<h2>Personal Zone 🧬</h2>
<div id="alliances"></div>
<div id="actions"></div>
</section>

<div id="toast" class="toast"></div>

<script>

// Firebase
const firebaseConfig = {
apiKey:"YOUR_API_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
databaseURL:"https://YOUR_PROJECT.firebaseio.com",
projectId:"YOUR_PROJECT"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();

// UI NAV
function go(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
gsap.from("#"+id,{opacity:0,y:30,duration:0.5});
}

// Toast
function toast(msg){
const t=document.getElementById("toast");
t.innerText=msg;
t.style.display="block";
gsap.fromTo(t,{y:50},{y:0,duration:0.3});
setTimeout(()=>t.style.display="none",2000);
}

// AUTH
function signup(){
const email=emailInput(),pass=passInput();
auth.createUserWithEmailAndPassword(email,pass).then(r=>{
db.ref("users/"+r.user.uid).set({email,role:"agent",online:true});
toast("Joined HFL ✅");
});
}
function login(){
auth.signInWithEmailAndPassword(emailInput(),passInput()).then(r=>{
db.ref("users/"+r.user.uid).update({online:true});
toast("Connected ⚡");
});
}
function emailInput(){return document.getElementById("email").value;}
function passInput(){return document.getElementById("pass").value;}

// CHAT
function send(){
const msg=document.getElementById("msg").value;
const u=auth.currentUser;
if(!u)return toast("Login first");
db.ref("chat").push({uid:u.uid,msg});
}
db.ref("chat").on("child_added",s=>{
const d=s.val();
const div=document.createElement("div");
div.innerText=d.msg;
document.getElementById("chatBox").appendChild(div);
gsap.from(div,{x:-20,opacity:0});
});

// USERS / HIERARCHY
db.ref("users").on("value",snap=>{
const data=snap.val()||{};
document.getElementById("count").innerText=Object.keys(data).length;
const box=document.getElementById("users");
box.innerHTML="";
for(let id in data){
const u=data[id];
const div=document.createElement("div");
div.className="user pulse";
div.innerHTML=`${u.email} <span class="${u.online?'online':''}">●</span>`;
div.onclick=()=>userMenu(id);
box.appendChild(div);
}
});

// USER MENU (ALLIANCE / REPORT)
function userMenu(uid){
const action=prompt("1 Alliance\n2 Report");
if(action==1){
db.ref("alliances").push({from:auth.currentUser.uid,to:uid});
toast("Alliance Sent 🔵");
}
if(action==2){
db.ref("reports").push({from:auth.currentUser.uid,to:uid});
toast("Reported ⚠️");
}
}

// LEGISLATION
function joinLaw(){
const u=auth.currentUser;
if(!u)return toast("Login");
db.ref("laws").push({uid:u.uid});
toast("Joined Law ⚖️");
}
db.ref("laws").on("value",snap=>{
const box=document.getElementById("lawList");
box.innerHTML="";
snap.forEach(s=>{
const div=document.createElement("div");
div.innerText=s.val().uid;
box.appendChild(div);
});
});

// PROFILE (ALLIANCES)
db.ref("alliances").on("value",snap=>{
const u=auth.currentUser;
if(!u)return;
const box=document.getElementById("alliances");
box.innerHTML="<h3>Alliances</h3>";
snap.forEach(s=>{
const a=s.val();
if(a.to==u.uid || a.from==u.uid){
const div=document.createElement("div");
div.innerText="Alliance Active";
box.appendChild(div);
}
});
});

// ONLINE STATUS
auth.onAuthStateChanged(u=>{
if(u){
db.ref("users/"+u.uid).onDisconnect().update({online:false});
}
});

</script>
</body>
</html>
