<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HFL Social Ultimate Pro</title>
<link rel="icon" href="https://via.placeholder.com/32/ff6b6b/ffffff?text=HFL" type="image/png">
<style>
/* --- בסיס --- */
body{margin:0;padding:0;font-family:'Segoe UI',sans-serif;background:#f0f2f5;color:#333;overflow-x:hidden;}
main{position:relative;width:100%;max-width:500px;margin:0 auto;height:100vh;display:flex;flex-direction:column;}
.page{position:absolute;width:100%;height:calc(100% - 60px);top:0;left:100%;opacity:0;transition:all 0.5s ease;}
.page.active{left:0;opacity:1;}
.card{background:#fff;padding:1em;margin:1em 0;border-radius:15px;box-shadow:0 3px 10px rgba(0,0,0,0.2);transition:transform 0.2s;}
.card:hover{transform:scale(1.02);}
input,button,textarea{width:100%;padding:0.7em;margin:0.5em 0;border-radius:8px;border:1px solid #ccc;font-size:1em;}
button{background:#ff6b6b;color:#fff;font-weight:bold;cursor:pointer;transition:0.3s;}
button:hover{background:#ff4757;}
textarea{resize:none;}
.avatar{width:40px;height:40px;border-radius:50%;margin-right:0.5em;display:flex;justify-content:center;align-items:center;font-weight:bold;color:#fff;background:#1e90ff;}
.message{display:flex;align-items:flex-start;margin:0.5em 0;animation:fadeIn 0.5s;}
.chat-box{height:200px;overflow-y:auto;padding:0.5em;border:1px solid #ccc;border-radius:10px;background:#f9f9f9;}
.friend-list{max-height:200px;overflow-y:auto;}
.friend-item{display:flex;justify-content:space-between;align-items:center;padding:0.3em 0;border-bottom:1px solid #eee;}
.story-container{display:flex;overflow-x:auto;margin:0.5em 0;animation:fadeIn 0.5s;}
.story{width:60px;height:60px;border-radius:50%;margin-right:0.5em;overflow:hidden;cursor:pointer;transition:0.3s;position:relative;}
.story:hover{transform:scale(1.2);}
.story img{width:100%;height:100%;object-fit:cover;}
.story-timer{position:absolute;bottom:0;width:100%;height:5px;background:#ff6b6b;transition:width 5s linear;}
.post{padding:0.5em;margin:0.5em 0;border-radius:10px;background:#f7f7f7;animation:fadeIn 0.5s;position:relative;}
.like-btn, .comment-btn{background:none;border:none;color:#ff6b6b;font-weight:bold;cursor:pointer;margin-right:0.5em;}
.comments{margin-top:0.5em;padding-left:1em;border-left:2px solid #eee;}
nav{position:fixed;bottom:0;left:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:0.5em 0;border-top:1px solid #ccc;}
nav button{background:none;color:#333;font-weight:bold;font-size:0.9em;width:100%;border:none;cursor:pointer;transition:0.3s;}
nav button.active{color:#ff6b6b;}
.hidden{display:none;}
.profile-pic{width:60px;height:60px;border-radius:50%;margin-bottom:0.5em;object-fit:cover;}
.online-dot{width:10px;height:10px;border-radius:50%;background:#2ed573;display:inline-block;margin-left:5px;}
h2,h3{margin:0.5em 0;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
</style>
</head>
<body>

<main>
<!-- Auth -->
<div class="card" id="auth-card">
<h2>כניסה / הרשמה</h2>
<input type="email" id="email" placeholder="אימייל">
<input type="password" id="password" placeholder="סיסמה">
<button id="login-btn">התחבר</button>
<button id="signup-btn">הרשם</button>
<p id="auth-msg" style="color:red;"></p>
</div>

<!-- App -->
<div id="app" class="hidden">

<!-- Pages -->
<div id="page-home" class="page card active">
<h3>פיד</h3>
<textarea id="new-post" placeholder="מה חדש?"></textarea>
<button id="post-btn">פרסם</button>
<div id="posts"></div>
</div>

<div id="page-stories" class="page card">
<h3>סטוריז</h3>
<div id="stories" class="story-container"></div>
</div>

<div id="page-friends" class="page card">
<h3>רשימת חברים</h3>
<div id="friends" class="friend-list"></div>
</div>

<div id="page-chat" class="page card">
<h3>צ׳אט ציבורי</h3>
<div class="chat-box" id="chat-box"></div>
<input type="text" id="chat-input" placeholder="כתוב הודעה...">
<button id="send-btn">שלח</button>
</div>

<div id="page-profile" class="page card">
<h3>פרופיל אישי</h3>
<img id="profile-pic" src="https://via.placeholder.com/60" class="profile-pic">
<input type="text" id="username" placeholder="שם משתמש">
<textarea id="bio" placeholder="ביוגרפיה קצרה"></textarea>
<input type="file" id="profile-upload">
<button id="update-profile">עדכן פרופיל</button>
<button id="logout-btn" style="background:#ff6b6b;">התנתק</button>
</div>

</div>
</main>

<!-- Navigation -->
<nav>
<button id="nav-home" class="active">בית</button>
<button id="nav-stories">סטוריז</button>
<button id="nav-friends">חברים</button>
<button id="nav-chat">צ׳אט</button>
<button id="nav-profile">פרופיל</button>
</nav>

<script type="module">
// Firebase Imports
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
import { getDatabase, ref, push, set, onValue, onChildAdded, update } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyCe6AIaouRgKfdsK6IEI6in316B52rO778",
  authDomain: "hflsystem.firebaseapp.com",
  databaseURL: "https://hflsystem-default-rtdb.firebaseio.com",
  projectId: "hflsystem",
  storageBucket: "hflsystem.firebasestorage.app",
  messagingSenderId: "469775027908",
  appId: "1:469775027908:web:f3501f10942f58ba18c391",
  measurementId: "G-G4W68NT5T2"
};

// Initialize
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

// Elements
const authCard=document.getElementById("auth-card");
const emailInput=document.getElementById("email");
const passwordInput=document.getElementById("password");
const loginBtn=document.getElementById("login-btn");
const signupBtn=document.getElementById("signup-btn");
const authMsg=document.getElementById("auth-msg");
const appDiv=document.getElementById("app");
const pages=document.querySelectorAll(".page");
const navButtons=[...document.querySelectorAll("nav button")];

const postsDiv=document.getElementById("posts");
const newPostInput=document.getElementById("new-post");
const postBtn=document.getElementById("post-btn");
const storiesDiv=document.getElementById("stories");
const friendsDiv=document.getElementById("friends");
const chatBox=document.getElementById("chat-box");
const chatInput=document.getElementById("chat-input");
const sendBtn=document.getElementById("send-btn");
const profilePic=document.getElementById("profile-pic");
const usernameInput=document.getElementById("username");
const bioInput=document.getElementById("bio");
const updateProfileBtn=document.getElementById("update-profile");
const profileUpload=document.getElementById("profile-upload");
const logoutBtn=document.getElementById("logout-btn");

// --- Navigation ---
function showPage(index){
pages.forEach((p,i)=>{p.classList.remove("active");if(i===index)p.classList.add("active");});
navButtons.forEach((b,i)=>b.classList.toggle("active",i===index));
}
navButtons.forEach((b,i)=>b.addEventListener("click",()=>showPage(i)));

// --- Auth ---
signupBtn.onclick=()=>{
createUserWithEmailAndPassword(auth,emailInput.value,passwordInput.value)
.then(cred=>{authMsg.textContent="נרשמת בהצלחה!";initUser(cred.user);})
.catch(err=>authMsg.textContent=err.message);
};
loginBtn.onclick=()=>signInWithEmailAndPassword(auth,emailInput.value,passwordInput.value)
.then(cred=>initUser(cred.user))
.catch(err=>authMsg.textContent=err.message);
logoutBtn.onclick=()=>signOut(auth).then(()=>location.reload());

// --- Init User ---
function initUser(user){
authCard.style.display="none";
appDiv.classList.remove("hidden");
set(ref(db,"users/"+user.uid),{
email:user.email,
online:true,
username:user.email.split("@")[0],
profilePic:profilePic.src,
bio:""
});
updatePosts();
updateStories();
updateFriends();
updateChat();
updateProfileUI(user);
}

// --- Profile ---
function updateProfileUI(user){
onValue(ref(db,"users/"+user.uid),snapshot=>{
const data=snapshot.val();
if(data){
profilePic.src=data.profilePic||"https://via.placeholder.com/60";
usernameInput.value=data.username||user.email.split("@")[0];
bioInput.value=data.bio||"";
}
});
}
updateProfileBtn.onclick=()=>{
const user=auth.currentUser;
const reader=new FileReader();
if(profileUpload.files[0]){
reader.readAsDataURL(profileUpload.files[0]);
reader.onload=()=>{ update(ref(db,"users/"+user.uid),{
username:usernameInput.value,bio:bioInput.value,profilePic:reader.result});};
}else{update(ref(db,"users/"+user.uid),{username:usernameInput.value,bio:bioInput.value});}
};

// --- Posts ---
postBtn.onclick=()=>{
const user=auth.currentUser;
if(newPostInput.value.trim()==="") return;
push(ref(db,"posts"),{
text:newPostInput.value,
sender:user.email.split("@")[0],
avatar:user.email[0].toUpperCase(),
time:new Date().toLocaleTimeString(),
likes:0,
comments:[]
});
newPostInput.value="";
};

function updatePosts(){
onValue(ref(db,"posts"),snapshot=>{
postsDiv.innerHTML="";
snapshot.forEach(snap=>{
const post=snap.val();
const div=document.createElement("div");
div.className="post";
div.innerHTML=`
<div style="display:flex;align-items:center;margin-bottom:0.5em;">
<div class="avatar">${post.avatar}</div><b>${post.sender}</b> <span style="font-size:0.8em;margin-left:5px;">${post.time}</span></div>
<p>${post.text}</p>
<button class="like-btn">❤️ ${post.likes||0}</button>
<button class="comment-btn">💬</button>
<div class="comments"></div>`;
postsDiv.appendChild(div);

div.querySelector(".like-btn").onclick=()=>{update(ref(db,"posts/"+snap.key),{likes:(post.likes||0)+1});};
const commentBtn=div.querySelector(".comment-btn");
const commentsDiv=div.querySelector(".comments");
commentBtn.onclick=()=>{
const comment=prompt("כתוב תגובה:");
if(comment){
const updatedComments=post.comments||[];
updatedComments.push({text:comment,sender:auth.currentUser.email.split("@")[0]});
update(ref(db,"posts/"+snap.key),{comments:updatedComments});
}
};
if(post.comments) post.comments.forEach(c=>{
const cdiv=document.createElement("div");
cdiv.textContent=`${c.sender}: ${c.text}`;
commentsDiv.appendChild(cdiv);
});
});
}

// --- Stories ---
const storyImages=["https://picsum.photos/id/237/100","https://picsum.photos/id/238/100","https://picsum.photos/id/239/100"];
function updateStories(){storiesDiv.innerHTML="";for(let i=0;i<storyImages.length;i++){
const s=document.createElement("div");s.className="story";const img=document.createElement("img");img.src=storyImages[i];s.appendChild(img);
const timer=document.createElement("div");timer.className="story-timer";s.appendChild(timer);
storiesDiv.appendChild(s);}
}

// --- Friends ---
function updateFriends(){
onValue(ref(db,"users"),snapshot=>{
friendsDiv.innerHTML="";
snapshot.forEach(snap=>{
const user=snap.val();
if(!user.email.startsWith("bot_")){
const div=document.createElement("div");
div.className="friend-item";
div.innerHTML=`<span>${user.username||user.email.split("@")[0]}</span><button onclick="addFriend('${snap.key}')">הוסף</button>${user.online?'<span class="online-dot"></span>':''}`;
friendsDiv.appendChild(div);}
});
}
window.addFriend=(uid)=>{
const current=auth.currentUser;
set(ref(db,"users/"+current.uid+"/friends/"+uid),true);
alert("המשתמש נוסף לחברים!");
};

// --- Chat ---
sendBtn.onclick=()=>{
const user=auth.currentUser;
if(chatInput.value.trim()==="") return;
push(ref(db,"chat"),{
text:chatInput.value,
sender:user.email.split("@")[0],
avatar:user.email[0].toUpperCase(),
time:new Date().toLocaleTimeString()
});
chatInput.value="";
};
function updateChat(){
onChildAdded(ref(db,"chat"),data=>{
const msg=data.val();
const div=document.createElement("div");
div.className="message";
div.innerHTML=`<div class="avatar">${msg.avatar}</div><div><b>${msg.sender}</b>: ${msg.text}</div>`;
chatBox.appendChild(div);
chatBox.scrollTop=chatBox.scrollHeight;
});
}

// --- Auth State ---
onAuthStateChanged(auth,user=>{if(user)initUser(user);});
</script>
</body>
</html>
