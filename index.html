<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HFL – Official Membership System</title>

    <!-- CSS נשאר כמו שהיה -->
    <style>
        :root { --gold: #d4af37; --neon: #0ff; --bg: #0a0a0c; }
        body { margin: 0; font-family: 'Segoe UI', system-ui; background: var(--bg); color: #fff; overflow-x: hidden; }
        .app-container { max-width: 1000px; margin: 40px auto; padding: 30px; background: rgba(255,255,255,0.03); border-radius: 20px; border: 1px solid rgba(0,255,255,0.1); backdrop-filter: blur(10px); box-shadow: 0 0 40px rgba(0,0,0,0.5); }
        h1 { text-align: center; letter-spacing: 5px; color: var(--neon); text-shadow: 0 0 20px var(--neon); }
        .grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 30px; }
        .form-section { display: flex; flex-direction: column; gap: 15px; }
        input { background: rgba(0,0,0,0.4); border: 1px solid #333; padding: 15px; border-radius: 8px; color: #fff; transition: 0.3s; }
        input:focus { border-color: var(--neon); outline: none; box-shadow: 0 0 10px rgba(0,255,255,0.2); }
        button { background: var(--neon); color: #000; padding: 15px; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 15px var(--neon); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #certCanvas { width: 100%; border-radius: 10px; border: 2px solid var(--gold); background: #fff; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>HFL OFFICIAL TERMINAL</h1>
    <div class="grid">
        <div class="form-section">
            <h3 style="color: var(--gold)">🏛️ הצטרפות לארגון</h3>
            <input type="text" id="name" placeholder="שם מלא (עברית/אנגלית)" required>
            <input type="email" id="email" placeholder="כתובת אימייל רשמית" required>
            <button id="masterBtn">חולל תעודה ואמת זהות</button>
            <button id="downloadBtn" class="hidden" style="background: var(--gold)">⬇️ הורד תעודה רשמית (PDF)</button>
        </div>
        <div class="preview-section">
            <canvas id="certCanvas" width="800" height="560"></canvas>
        </div>
    </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
    // --- Firebase init ---
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "SENDER_ID",
        appId: "APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const canvas = document.getElementById('certCanvas');
    const ctx = canvas.getContext('2d');
    const masterBtn = document.getElementById('masterBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    // --- Serial Generator ---
    const generateSecureSerial = () => {
        const raw = `HFL-${Math.floor(1000 + Math.random() * 9000)}-${Date.now().toString().slice(-4)}`;
        const check = raw.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0) % 10;
        return `${raw}-${check}`;
    };

    // --- Certificate Render ---
    const renderCertificate = (name, serial) => {
        ctx.clearRect(0,0,canvas.width,canvas.height);

        const grad = ctx.createRadialGradient(400, 280, 50, 400, 280, 500);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(1, '#f0f0f0');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 800, 560);

        ctx.save();
        ctx.translate(400, 280);
        ctx.rotate(-Math.PI / 4);
        ctx.font = "bold 80px Arial";
        ctx.fillStyle = "rgba(0,0,0,0.03)";
        ctx.textAlign = "center";
        for(let i=-5; i<5; i++) {
            ctx.fillText("HFL OFFICIAL SYSTEM ".repeat(3), 0, i * 100);
        }
        ctx.restore();

        ctx.strokeStyle = "#d4af37";
        ctx.lineWidth = 15;
        ctx.strokeRect(20, 20, 760, 520);
        ctx.lineWidth = 2;
        ctx.strokeRect(35, 35, 730, 490);

        ctx.fillStyle = "#1a1a1a";
        ctx.textAlign = "center";
        ctx.font = "bold 40px serif";
        ctx.fillText("Human Free Light (HFL)", 400, 100);
        ctx.font = "25px Arial";
        ctx.fillText("תעודת חברות רשמית", 400, 150);
        ctx.fillStyle = "#333";
        ctx.font = "22px Arial";
        ctx.fillText("מאושר בזאת כי:", 400, 230);
        ctx.fillStyle = "#000";
        ctx.font = "bold 45px Arial";
        ctx.fillText(name, 400, 290);
        ctx.font = "18px monospace";
        ctx.fillStyle = "#666";
        ctx.fillText(`SERIAL: ${serial}`, 400, 480);

        ctx.beginPath();
        ctx.arc(650, 420, 50, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(200,0,0,0.5)";
        ctx.lineWidth = 5;
        ctx.stroke();
        ctx.font = "bold 15px Arial";
        ctx.fillStyle = "rgba(200,0,0,0.5)";
        ctx.fillText("APPROVED", 650, 425);
    };

    // --- Button Actions ---
    masterBtn.addEventListener('click', async () => {
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        if(!name || !email) return alert("נא למלא פרטים");

        masterBtn.disabled = true;
        masterBtn.innerText = "מעבד נתונים...";

        const serial = generateSecureSerial();

        try {
            const userRef = db.collection("members").doc(btoa(email));
            await userRef.set({
                name, email, serial,
                joinedAt: firebase.firestore.FieldValue.serverTimestamp(),
                status: "active",
                role: 1
            });

            renderCertificate(name, serial);
            downloadBtn.classList.remove('hidden');
            alert("הנתונים נרשמו במערכת המרכזית!");
        } catch(e) {
            console.error(e);
            alert("שגיאה בחיבור למסד הנתונים");
        } finally {
            masterBtn.disabled = false;
            masterBtn.innerText = "חולל תעודה ואמת זהות";
        }
    });

    downloadBtn.addEventListener('click', () => {
        const imgData = canvas.toDataURL('image/png');
        const pdf = new jspdf.jsPDF('landscape', 'px', [800, 560]);
        pdf.addImage(imgData, 'PNG', 0, 0, 800, 560);
        pdf.save(`HFL_CERT_${Date.now()}.pdf`);
    });

    renderCertificate("שם המצטרף", "HFL-XXXX-XXXX");
</script>

</body>
</html>
