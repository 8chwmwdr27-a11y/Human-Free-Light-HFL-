<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HFL Chat + AI</title>
<style>
  /* SUS Dark Modern */
  body { font-family: 'Segoe UI', sans-serif; background:#0d1117; color:#c9d1d9; margin:0; }
  header { background:#161b22; padding:20px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; color:#58a6ff; }
  nav button { background:#238636; color:white; border:none; padding:8px 16px; margin-left:8px; cursor:pointer; border-radius:6px; transition:0.3s; }
  nav button:hover { background:#2ea043; }
  main { padding:20px; }
  .card { background:#161b22; padding:20px; margin-bottom:16px; border-radius:10px; box-shadow: 0 0 10px #58a6ff33; }
  input, button { padding:10px; border-radius:6px; border:none; margin:5px 0; width:100%; }
  input[type=password] { font-family: 'Courier New', monospace; }
  .success { color:#2ea043; font-weight:bold; transition:0.5s; }
  .error { color:#f85149; font-weight:bold; transition:0.5s; }
  .chat-box { background:#0d1117; border:1px solid #30363d; border-radius:10px; padding:10px; max-height:300px; overflow-y:auto; }
  .chat-message { margin-bottom:10px; padding:6px; border-radius:6px; background:#21262d; transition:0.3s; }
  .online-dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#2ea043; margin-right:6px; }
  .user-list { margin-top:10px; padding:10px; border:1px solid #30363d; border-radius:10px; background:#161b22; }
</style>
</head>
<body>

<header>
  <h1>HFL Chat</h1>
  <nav>
    <button onclick="showSection('home')">Home</button>
    <button onclick="showSection('signup')">Sign Up</button>
    <button onclick="showSection('login')">Login</button>
    <button onclick="showSection('chat')">Chat</button>
  </nav>
</header>

<main>
  <!-- Home -->
  <section id="home">
    <div class="card">
      <h2>Welcome to Human Free Light HFL</h2>
      <p>Our mission: human freedom and creating a civil alternative organization. Join us to shape a self-governing community. 🌟</p>
    </div>
  </section>

  <!-- Sign Up -->
  <section id="signup" style="display:none">
    <div class="card">
      <h2>Sign Up</h2>
      <input type="text" id="signup-name" placeholder="Your Name">
      <input type="email" id="signup-email" placeholder="Email">
      <input type="password" id="signup-password" placeholder="Password (min 8 chars + number)">
      <button onclick="signUp()">Register</button>
      <p id="signup-msg"></p>
    </div>
  </section>

  <!-- Login -->
  <section id="login" style="display:none">
    <div class="card">
      <h2>Login</h2>
      <input type="email" id="login-email" placeholder="Email">
      <input type="password" id="login-password" placeholder="Password">
      <button onclick="login()">Login</button>
      <p id="login-msg"></p>
    </div>
  </section>

  <!-- Chat -->
  <section id="chat" style="display:none">
    <div class="card">
      <h2>Chat</h2>
      <div class="chat-box" id="chat-box"></div>
      <input type="text" id="chat-input" placeholder="Type a message">
      <button onclick="sendMessage()">Send</button>
      <div class="user-list" id="user-list"></div>
    </div>
  </section>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
  import { getDatabase, ref, push, set, onChildAdded, onValue } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCe6AIaouRgKfdsK6IEI6in316B52rO778",
    authDomain: "hflsystem.firebaseapp.com",
    databaseURL: "https://hflsystem-default-rtdb.firebaseio.com",
    projectId: "hflsystem",
    storageBucket: "hflsystem.firebasestorage.app",
    messagingSenderId: "469775027908",
    appId: "1:469775027908:web:f3501f10942f58ba18c391"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let currentUser = null;

  function showSection(id) {
    document.querySelectorAll('main section').forEach(s => s.style.display='none');
    document.getElementById(id).style.display='block';
  }

  // Sign Up
  window.signUp = function() {
    const name = document.getElementById('signup-name').value;
    const email = document.getElementById('signup-email').value;
    const password = document.getElementById('signup-password').value;
    const msg = document.getElementById('signup-msg');

    if(name && email && password.length>=8 && /\d/.test(password)){
      const usersRef = ref(db, 'users');
      const newUserRef = push(usersRef);
      set(newUserRef, { name, email, password, online:false });
      msg.textContent = "✅ Registered successfully!";
      msg.className = 'success';
    } else {
      msg.textContent = "⚠️ Invalid input or weak password";
      msg.className = 'error';
    }
  };

  // Login
  window.login = function() {
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const msg = document.getElementById('login-msg');
    const usersRef = ref(db, 'users');

    onChildAdded(usersRef, snapshot => {
      const u = snapshot.val();
      if(u.email===email && u.password===password){
        currentUser = snapshot.key;
        msg.textContent = "✅ Login successful!";
        msg.className='success';
        set(ref(db,'users/'+currentUser+'/online'), true);
        showSection('chat');
        updateUserList();
      }
    });
  };

  // Chat
  window.sendMessage = function() {
    const input = document.getElementById('chat-input');
    const text = input.value;
    if(!text) return;
    const messagesRef = ref(db, 'messages');
    const newMsgRef = push(messagesRef);
    set(newMsgRef, { user: currentUser || 'AI', text, timestamp: Date.now() });
    input.value='';
  };

  // Show chat messages
  const chatBox = document.getElementById('chat-box');
  const messagesRef = ref(db, 'messages');
  onChildAdded(messagesRef, snapshot => {
    const m = snapshot.val();
    const div = document.createElement('div');
    div.className = 'chat-message';
    div.textContent = `${m.user}: ${m.text}`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;

    // AI bot responds automatically to greetings
    if(m.user!==currentUser && /hello|hi|hey/i.test(m.text)){
      setTimeout(()=>sendAImessage("Hello! Welcome to HFL chat 🌟"),500);
    }
  });

  function sendAImessage(msg){
    const messagesRef = ref(db, 'messages');
    const newMsgRef = push(messagesRef);
    set(newMsgRef, { user:'HFL AI', text:msg, timestamp: Date.now() });
  }

  // Update online users
  function updateUserList(){
    const userListDiv = document.getElementById('user-list');
    userListDiv.innerHTML='';
    const usersRef = ref(db, 'users');
    onValue(usersRef, snapshot=>{
      const users = snapshot.val();
      for(const key in users){
        if(users[key].online){
          const div = document.createElement('div');
          div.innerHTML = `<span class="online-dot"></span>${users[key].name}`;
          userListDiv.appendChild(div);
        }
      }
    });
  }

</script>

</body>
</html>
